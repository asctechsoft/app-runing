# X06: cập nhật phụ thuộc định kỳ. Gói nền dùng chung với base ASC (dsp_base/asc_common) bị bỏ qua bản major:
# chỉ nâng khi nâng cả base cho mọi app (xem docs/dependencies.md, docs/adr/0002-shared-base.md).
version: 2
updates:
  - package-ecosystem: pub
    directory: /mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    ignore:
      - dependency-name: "firebase_*"
        update-types: ["version-update:semver-major"]
      - dependency-name: cloud_firestore
        update-types: ["version-update:semver-major"]
      - dependency-name: permission_handler
        update-types: ["version-update:semver-major"]
      - dependency-name: get
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /scripts
    schedule:
      interval: monthly
    labels: [dependencies]

  - package-ecosystem: npm
    directory: /firestore-tests
    schedule:
      interval: monthly
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
