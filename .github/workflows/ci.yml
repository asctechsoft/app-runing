name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      # asc_common và dsp_base là git dependency (pubspec.yaml), `flutter pub get` tự tải từ GitHub.
      - uses: actions/checkout@v4
      # Dart >= 3.13.3 (asc_common yêu cầu) → Flutter 3.47.x.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true
      - name: Install (lock)
        run: flutter pub get --enforce-lockfile
      - name: Format
        run: dart format -l 160 --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: No placeholder screens
        run: "! grep -rl TodoScreen lib"
      - name: Unit + widget tests (+ độ phủ)
        run: flutter test --coverage
      - name: Coverage thresholds (Q09)
        run: python3 tool/check_coverage.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build scripts compile
        run: python -m py_compile build.py tool/build_helper.py tool/build_aab.py tool/translate.py
      # Flavor dev: cùng applicationId nên dùng chung google-services.json; AdMob dùng app ID test (xem android/app/build.gradle.kts).
      - name: Build staging APK
        run: flutter build apk --debug --flavor dev --dart-define=STRIDE_ENV=staging
      - uses: actions/upload-artifact@v7
        with:
          name: stride-staging-apk
          path: mobile/build/app/outputs/flutter-apk/app-dev-debug.apk
          retention-days: 14

  firestore-rules:
    name: Firestore rules (Emulator)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firestore-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firestore-tests/package-lock.json
      # firebase-tools 13 (ghim) cần Java 11+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install (lock)
        run: npm ci
      - name: Rules tests (FB03)
        run: npm run test:emulator
